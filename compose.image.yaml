# Xboard 精简版 —— 使用 GitHub CI 预构建镜像部署（不现场构建，最快）
#
# 与 compose.yaml 的区别：这里不执行 `build:`，直接拉取 CI 已发布的镜像。
# 适合服务器不方便现场编译（国内网络拉 apk / composer 慢）的场景。
#
# 用法：
#   git clone https://github.com/Activity163/Xboard.git && cd Xboard
#   touch .env
#   docker compose -f compose.image.yaml run --rm \
#     -e ENABLE_SQLITE=true -e ENABLE_REDIS=true \
#     -e ADMIN_ACCOUNT=admin@example.com \
#     xboard php artisan xboard:install
#   docker compose -f compose.image.yaml up -d
#
# 镜像由 .github/workflows/docker-publish.yml 在每次 push master 时自动构建，
# 支持 amd64 / arm64。可用的 tag：latest、master、new、<短commit>。
services:
  xboard:
    image: ghcr.io/activity163/xboard:latest
    # 固定容器名，让外挂的 Docker Caddy 可用 xboard:7001 反代
    container_name: xboard
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    # 外挂 Docker Caddy 反代：打开 networks 段，name 填外层 Caddy 所在网络
    # （docker network ls 查看，用 external 复用既有网络，两容器互访）。
    # 同时打开下方 ENABLE_CADDY=false，让 Octane 直接绑 7001。
    # networks:
    #   - caddy-net
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      # - ENABLE_CADDY=false           # 外挂 Caddy 反代时打开，少一跳代理
      - docker=true

# networks:
#   caddy-net:
#     external: true

volumes:
  redis-data:
