# Xboard 精简版 —— 唯一的部署文件（个人自用）
#
# 直接用 GitHub Actions 预构建好的镜像，服务器不现场编译。
# 镜像：ghcr.io/activity163/xboard:latest（每次 push master 自动构建，amd64 / arm64）
#
# ── 部署 ────────────────────────────────────────────────────────────────
#   git clone https://github.com/Activity163/Xboard.git && cd Xboard
#   touch .env
#   docker compose -f compose.image.yaml run --rm \
#     -e ENABLE_SQLITE=true -e ENABLE_REDIS=true \
#     -e ADMIN_ACCOUNT=admin@example.com \
#     xboard php artisan xboard:install
#   docker compose -f compose.image.yaml up -d
#
#   注意：文件名不是 compose.yaml，所以每条命令都要带 -f compose.image.yaml，
#   或者直接 `alias dc='docker compose -f compose.image.yaml'`。
#
# ── 反代架构 ────────────────────────────────────────────────────────────
#   本机**不用镜像内置的 Caddy**，由宿主机上已存在的独立 Caddy 容器反代：
#     nezha-caddy ──(nezha-dashboard_default 网络，容器名 xboard:7001)──> xboard
#   所以：
#     · ENABLE_CADDY=false  → Octane 直接绑 0.0.0.0:7001（少一跳，省内存）
#     · networks 接入外层 Caddy 所在的 external 网络，靠容器名做 DNS
#   若哪天想改回镜像内置 Caddy：删掉 networks 段 + 把 ENABLE_CADDY 改成 true，
#   此时 Caddy 占 7001，Octane 自动退到 127.0.0.1:7002。
services:
  xboard:
    image: ghcr.io/activity163/xboard:latest
    container_name: xboard
    restart: unless-stopped
    ports:
      - "7001:7001"
    networks:
      - nezha-dashboard_default
    volumes:
      # 只有这些是"宿主机数据"，PHP 代码与前端 dist 在镜像里
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - ENABLE_CADDY=false             # 用外挂 Caddy，Octane 直接绑 7001
      - docker=true

networks:
  # docker network ls 里已存在的网络，标记 external 让 compose 复用而不是新建
  nezha-dashboard_default:
    external: true

volumes:
  redis-data:
